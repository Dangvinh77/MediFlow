name: Commit policy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify authors and trailers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test commit policy
        run: node --test scripts/verify-commit-policy.test.js
      - name: Verify pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-commit-policy.js --range "$BASE_SHA..$HEAD_SHA"
      - name: Verify pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/verify-commit-policy.js --range "$BEFORE_SHA..$HEAD_SHA"
      - name: Verify workflow dispatch head
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/verify-commit-policy.js --range "HEAD^..HEAD"
