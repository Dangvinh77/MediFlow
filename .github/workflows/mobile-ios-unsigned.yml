name: Mobile iOS unsigned IPA

on:
  push:
    branches: [master]
    paths: ['mobile/**', '.github/workflows/mobile-ios-unsigned.yml']
  pull_request:
    branches: [master]
    paths: ['mobile/**', '.github/workflows/mobile-ios-unsigned.yml']
  workflow_dispatch:
    inputs:
      gateway_url:
        description: 'Gateway URL ending in /api (empty uses MOBILE_GATEWAY_URL repository variable, then LAN demo default)'
        type: string
        default: ''
      build_mode:
        description: 'Profile opens from the home screen and supports LAN HTTP; Debug needs Flutter tooling or Xcode to launch; Release requires HTTPS. All outputs are unsigned.'
        type: choice
        options: [profile, debug, release]
        default: profile

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GATEWAY_URL: ${{ inputs.gateway_url || vars.MOBILE_GATEWAY_URL || 'http://192.168.1.3:28080/api' }}
      BUILD_MODE: ${{ inputs.build_mode || 'profile' }}
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate build configuration
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ['GATEWAY_URL'])
          mode = os.environ['BUILD_MODE']
          if (mode not in ('profile', 'debug', 'release') or url.scheme not in ('http', 'https')
              or not url.hostname or url.username is not None or url.password is not None
              or url.query or url.fragment or url.path not in ('/api', '/api/')
              or url.port in (*range(8081, 8092), 8761)):
              raise SystemExit('Invalid Gateway URL or build mode; use a Gateway URL ending in /api.')
          if url.hostname.lower() == 'localhost':
              raise SystemExit('localhost points at the iPhone itself. Use the backend LAN IP or HTTPS host.')
          try:
              if ipaddress.ip_address(url.hostname).is_loopback:
                  raise SystemExit('Loopback addresses point at the iPhone itself.')
          except ValueError:
              pass
          if mode == 'release' and url.scheme != 'https':
              raise SystemExit('Release requires HTTPS: the Release plist has no HTTP exception.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ALLOW_INSECURE_HTTP={str(url.scheme == "http").lower()}\n')
          PY
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Show build tool versions
        run: |
          flutter --version
          xcodebuild -version
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run mobile tests
        run: flutter test
      - name: Build device application without signing
        run: |
          flutter build ios "--$BUILD_MODE" --no-codesign \
            "--build-number=$GITHUB_RUN_NUMBER" \
            "--dart-define=GATEWAY_URL=$GATEWAY_URL" \
            "--dart-define=ALLOW_INSECURE_HTTP=$ALLOW_INSECURE_HTTP" \
            --dart-define=MEDIFLOW_OUTPATIENT_UI_ENABLED=true \
            --dart-define=MEDIFLOW_REPORT_OUTPATIENT_UI_ENABLED=true \
            --dart-define=MEDIFLOW_SCHEDULING_UI_ENABLED=true \
            --dart-define=MEDIFLOW_OUTPATIENT_QUOTES_UI_ENABLED=true \
            --dart-define=MEDIFLOW_ZERO_PAYABLE_UI_ENABLED=true \
            --dart-define=PHARMACY_MODE=outpatient
      - name: Package unsigned IPA and build information
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/unsigned-ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/unsigned-ipa/Payload/Runner.app
          cd build/unsigned-ipa
          /usr/bin/zip -q -r -y mediflow-unsigned.ipa Payload
          /usr/bin/unzip -t mediflow-unsigned.ipa
          rm -rf Payload
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          info = {key: os.environ[key] for key in (
              'GITHUB_SHA', 'GITHUB_RUN_NUMBER', 'BUILD_MODE', 'GATEWAY_URL', 'ALLOW_INSECURE_HTTP')}
          info.update(signed=False, flutter_version='3.47.0', installable_without_signing=False)
          Path('build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          Path('README.txt').write_text(
              'UNSIGNED IPA: cannot be installed directly on iPhone or uploaded to TestFlight.\n'
              'Apple signing and a matching provisioning profile are still required.\n'
              'The Gateway URL is compiled into this app; rebuild when the backend IP changes.\n'
              'Profile opens from the home screen and supports LAN HTTP after granting Local Network permission. Debug only launches from Flutter tooling or Xcode; Release requires HTTPS.\n')
          PY
          shasum -a 256 mediflow-unsigned.ipa > SHA256SUMS.txt
          cat README.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mediflow-ios-unsigned-${{ env.BUILD_MODE }}-${{ github.run_number }}
          path: mobile/build/unsigned-ipa/
          if-no-files-found: error
          retention-days: 14
