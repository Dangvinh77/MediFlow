name: Mobile Android APK

on:
  push:
    branches: [master]
    paths: ['mobile/**', '.github/workflows/mobile-android-apk.yml']
  pull_request:
    branches: [master]
    paths: ['mobile/**', '.github/workflows/mobile-android-apk.yml']
  workflow_dispatch:
    inputs:
      gateway_url:
        description: 'Gateway URL ending in /api (empty uses MOBILE_GATEWAY_URL repository variable, then LAN demo default)'
        type: string
        default: ''
      build_mode:
        description: 'Debug installs from the APK and allows LAN HTTP; Profile and Release require HTTPS. All APKs use the debug signing key.'
        type: choice
        options: [debug, profile, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GATEWAY_URL: ${{ inputs.gateway_url || vars.MOBILE_GATEWAY_URL || 'http://192.168.1.3:28080/api' }}
      BUILD_MODE: ${{ inputs.build_mode || 'debug' }}
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate build configuration
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ['GATEWAY_URL'])
          mode = os.environ['BUILD_MODE']
          if (mode not in ('debug', 'profile', 'release') or url.scheme not in ('http', 'https')
              or not url.hostname or url.username is not None or url.password is not None
              or url.query or url.fragment or url.path not in ('/api', '/api/')
              or url.port in (*range(8081, 8092), 8761)):
              raise SystemExit('Invalid Gateway URL or build mode; use a Gateway URL ending in /api.')
          if url.hostname.lower() == 'localhost':
              raise SystemExit('localhost points at the phone itself. Use the backend LAN IP (10.0.2.2 on the emulator) or an HTTPS host.')
          try:
              if ipaddress.ip_address(url.hostname).is_loopback:
                  raise SystemExit('Loopback addresses point at the phone itself.')
          except ValueError:
              pass
          if mode != 'debug' and url.scheme != 'https':
              raise SystemExit('Profile and Release require HTTPS: only the debug manifest allows cleartext HTTP.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ALLOW_INSECURE_HTTP={str(url.scheme == "http").lower()}\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Show build tool versions
        run: |
          flutter --version
          java -version
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run mobile tests
        run: flutter test
      - name: Build APK
        run: |
          flutter build apk "--$BUILD_MODE" \
            "--build-number=$GITHUB_RUN_NUMBER" \
            "--dart-define=GATEWAY_URL=$GATEWAY_URL" \
            "--dart-define=ALLOW_INSECURE_HTTP=$ALLOW_INSECURE_HTTP" \
            --dart-define=MEDIFLOW_OUTPATIENT_UI_ENABLED=true \
            --dart-define=MEDIFLOW_REPORT_OUTPATIENT_UI_ENABLED=true \
            --dart-define=MEDIFLOW_SCHEDULING_UI_ENABLED=true \
            --dart-define=MEDIFLOW_OUTPATIENT_QUOTES_UI_ENABLED=true \
            --dart-define=MEDIFLOW_ZERO_PAYABLE_UI_ENABLED=true \
            --dart-define=PHARMACY_MODE=outpatient
      - name: Package APK and build information
        run: |
          apk="build/app/outputs/flutter-apk/app-$BUILD_MODE.apk"
          test -f "$apk"
          mkdir -p build/android-apk
          cp "$apk" "build/android-apk/mediflow-$BUILD_MODE.apk"
          cd build/android-apk
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          info = {key: os.environ[key] for key in (
              'GITHUB_SHA', 'GITHUB_RUN_NUMBER', 'BUILD_MODE', 'GATEWAY_URL', 'ALLOW_INSECURE_HTTP')}
          info.update(signing_key='debug', flutter_version='3.47.0')
          Path('build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          Path('README.txt').write_text(
              'Install: copy the APK to the phone and allow "Install unknown apps" for the file manager or browser.\n'
              'Signed with the CI debug key: uninstall an older MediFlow build first if Android reports a signature conflict.\n'
              'The Gateway URL is compiled into this app; rebuild when the backend IP changes.\n'
              'Debug allows LAN HTTP; Profile and Release require an HTTPS Gateway. Not a Play Store build.\n')
          PY
          sha256sum "mediflow-$BUILD_MODE.apk" > SHA256SUMS.txt
          cat README.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mediflow-android-${{ env.BUILD_MODE }}-${{ github.run_number }}
          path: mobile/build/android-apk/
          if-no-files-found: error
          retention-days: 14
