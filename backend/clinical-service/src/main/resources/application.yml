server:
  port: 8082

spring:
  application:
    name: clinical-service

  datasource:
    url: jdbc:postgresql://localhost:5432/mediflow_clinical
    username: ${MEDIFLOW_DB_USER:postgres}
    password: ${MEDIFLOW_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; never 'update' outside local dev
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${MEDIFLOW_RABBIT_HOST:localhost}
    port: 5672
    username: ${MEDIFLOW_RABBIT_USER:guest}
    password: ${MEDIFLOW_RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
          billing-service:
            connectTimeout: 1000
            readTimeout: 2000
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Resilient synchronous cross-service reads — see docs/ai/01-architecture.md.
# This service REST-checks patients (patient-service) and staff (organization-service).
# A downstream outage must degrade this service, not cascade through it.

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

# Shared HS256 secret — MUST match the gateway. Provide via env in real environments.
mediflow:
  profile: ${MEDIFLOW_PROFILE:compatibility-v0}
  features:
    outpatient-mvp:
      enabled: ${MEDIFLOW_OUTPATIENT_MVP_ENABLED:false}
    care-finance-v2:
      enabled: ${MEDIFLOW_CARE_FINANCE_V2_ENABLED:false}
    admission-referral:
      # Keep the pre-MVP V2 default when no profile/gate is selected.
      enabled: ${MEDIFLOW_ADMISSION_REFERRAL_ENABLED:${mediflow.features.care-finance-v2.enabled:false}}
  clients:
    organization-service: ${MEDIFLOW_ORGANIZATION_SERVICE:organization-service}
    patient-service: ${MEDIFLOW_PATIENT_SERVICE:patient-service}
    billing-service: ${MEDIFLOW_BILLING_SERVICE:billing-service}
  clinical:
    durable-events:
      enabled: ${MEDIFLOW_CLINICAL_DURABLE_EVENTS_ENABLED:false}
    prescription-context-lookup:
      enabled: ${MEDIFLOW_CLINICAL_PRESCRIPTION_CONTEXT_LOOKUP_ENABLED:false}
    exam-price:
      default-code: ${MEDIFLOW_EXAM_PRICE_CODE:OUTPATIENT_EXAM}
      by-department: {}
    outbox-poll-interval: ${MEDIFLOW_CLINICAL_OUTBOX_POLL_INTERVAL:1000}
    outbox-confirm-timeout: ${MEDIFLOW_CLINICAL_OUTBOX_CONFIRM_TIMEOUT:5s}
    outbox-max-retries: ${MEDIFLOW_CLINICAL_OUTBOX_MAX_RETRIES:5}
  jwt:
    secret: ${MEDIFLOW_JWT_SECRET}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: MediFlow Clinical Service
    description: Lịch hẹn, hồ sơ bệnh án và chẩn đoán.
    version: v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
