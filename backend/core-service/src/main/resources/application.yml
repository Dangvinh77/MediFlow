server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: core-service
  jpa:
    open-in-view: false
    properties:
      hibernate.hbm2ddl.auto: validate
  rabbitmq:
    host: ${MEDIFLOW_RABBIT_HOST:localhost}
    port: ${MEDIFLOW_RABBIT_PORT:5672}
    username: ${MEDIFLOW_RABBIT_USER:guest}
    password: ${MEDIFLOW_RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 8000
          writetimeout: 8000

mediflow:
  public-web-url: ${MEDIFLOW_PUBLIC_WEB_URL:http://localhost:3000}
  mail:
    from: ${MEDIFLOW_MAIL_FROM:noreply@mediflow.local}
    from-name: ${MEDIFLOW_MAIL_FROM_NAME:MediFlow}
  security-mail:
    encryption-key: ${MEDIFLOW_SECURITY_MAIL_KEY:}
    dispatch-enabled: ${MEDIFLOW_SECURITY_MAIL_DISPATCH_ENABLED:true}
    dispatch-delay-ms: ${MEDIFLOW_SECURITY_MAIL_DISPATCH_DELAY_MS:5000}
  demo-mailbox:
    enabled: ${MEDIFLOW_DEMO_MAILBOX_ENABLED:false}
    retention-days: ${MEDIFLOW_DEMO_MAILBOX_RETENTION_DAYS:30}
  patient-email-sync:
    dispatch-enabled: ${MEDIFLOW_PATIENT_EMAIL_SYNC_DISPATCH_ENABLED:true}
    dispatch-delay-ms: ${MEDIFLOW_PATIENT_EMAIL_SYNC_DELAY_MS:5000}
  demo-seed:
    enabled: ${MEDIFLOW_DEMO_SEED_ENABLED:true}
  datasource:
    organization:
      url: ${MEDIFLOW_ORGANIZATION_DB_URL:jdbc:postgresql://localhost:5432/mediflow_organization}
      username: ${MEDIFLOW_ORGANIZATION_DB_USER:${MEDIFLOW_DB_USER:postgres}}
      password: ${MEDIFLOW_ORGANIZATION_DB_PASSWORD:${MEDIFLOW_DB_PASSWORD:postgres}}
      driver-class-name: org.postgresql.Driver
    patient:
      url: ${MEDIFLOW_PATIENT_DB_URL:jdbc:postgresql://localhost:5432/mediflow_patient}
      username: ${MEDIFLOW_PATIENT_DB_USER:${MEDIFLOW_DB_USER:postgres}}
      password: ${MEDIFLOW_PATIENT_DB_PASSWORD:${MEDIFLOW_DB_PASSWORD:postgres}}
      driver-class-name: org.postgresql.Driver
  jwt:
    secret: ${MEDIFLOW_JWT_SECRET}
  patient:
    outbox:
      scheduling-enabled: ${MEDIFLOW_PATIENT_OUTBOX_SCHEDULING_ENABLED:true}
      delay-ms: ${MEDIFLOW_PATIENT_OUTBOX_DELAY_MS:5000}
      maximum-attempts: ${MEDIFLOW_PATIENT_OUTBOX_MAXIMUM_ATTEMPTS:8}
  organization:
    surgery-authority:
      outbox-enabled: ${MEDIFLOW_ORGANIZATION_SURGERY_AUTHORITY_OUTBOX_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
