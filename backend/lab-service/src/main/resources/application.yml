server:
  port: 8084

spring:
  application:
    name: lab-service

  datasource:
    url: jdbc:postgresql://localhost:5432/mediflow_lab
    username: ${MEDIFLOW_DB_USER:postgres}
    password: ${MEDIFLOW_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; never 'update' outside local dev
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${MEDIFLOW_RABBIT_HOST:localhost}
    port: 5672
    username: ${MEDIFLOW_RABBIT_USER:guest}
    password: ${MEDIFLOW_RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

  cloud:
    openfeign:
      client:
        config:
          labClinicalOrderContextClient:
            connectTimeout: 1000
            readTimeout: 2000

mediflow:
  profile: ${MEDIFLOW_PROFILE:compatibility-v0}
  jwt:
    secret: ${MEDIFLOW_JWT_SECRET}
  features:
    outpatient-mvp:
      enabled: ${MEDIFLOW_OUTPATIENT_MVP_ENABLED:false}
    care-finance-v2: ${MEDIFLOW_CARE_FINANCE_V2:false}
  lab:
    clinical-context:
      enabled: ${MEDIFLOW_LAB_CLINICAL_CONTEXT_ENABLED:false}
  events:
    outbox-poll-interval: ${MEDIFLOW_OUTBOX_POLL_INTERVAL:1000}
    outbox-confirm-timeout-ms: ${MEDIFLOW_LAB_OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    outbox-max-retries: ${MEDIFLOW_LAB_OUTBOX_MAX_RETRIES:5}
    outbox-initial-backoff-ms: ${MEDIFLOW_LAB_OUTBOX_INITIAL_BACKOFF_MS:1000}
    outbox-max-backoff-ms: ${MEDIFLOW_LAB_OUTBOX_MAX_BACKOFF_MS:60000}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: MediFlow Lab Service
    description: Chỉ định xét nghiệm và kết quả xét nghiệm.
    version: v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
