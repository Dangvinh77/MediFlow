server:
  port: 8084

spring:
  application:
    name: lab-service

  datasource:
    url: jdbc:postgresql://localhost:5432/mediflow_lab
    username: ${MEDIFLOW_DB_USER:postgres}
    password: ${MEDIFLOW_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; never 'update' outside local dev
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${MEDIFLOW_RABBIT_HOST:localhost}
    port: 5672
    username: ${MEDIFLOW_RABBIT_USER:guest}
    password: ${MEDIFLOW_RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Shared HS256 secret — MUST match the gateway. Provide via env in real environments.
mediflow:
  jwt:
    secret: ${MEDIFLOW_JWT_SECRET}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: MediFlow Lab Service
    description: Chỉ định xét nghiệm và kết quả xét nghiệm.
    version: v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
