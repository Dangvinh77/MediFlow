server:
  port: 8086

spring:
  application:
    name: billing-service

  datasource:
    url: jdbc:postgresql://localhost:5432/mediflow_billing
    username: ${MEDIFLOW_DB_USER:postgres}
    password: ${MEDIFLOW_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; never 'update' outside local dev
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${MEDIFLOW_RABBIT_HOST:localhost}
    port: 5672
    username: ${MEDIFLOW_RABBIT_USER:guest}
    password: ${MEDIFLOW_RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Shared HS256 secret — MUST match the gateway. Provide via env in real environments.
mediflow:
  jwt:
    secret: ${MEDIFLOW_JWT_SECRET:dev-only-change-me-please-32bytes-minimum-secret-key}
  billing:
    rabbit:
      retry:
        max-attempts: ${MEDIFLOW_BILLING_RABBIT_RETRY_MAX_ATTEMPTS:3}
        initial-interval-ms: ${MEDIFLOW_BILLING_RABBIT_RETRY_INITIAL_INTERVAL_MS:1000}
        max-interval-ms: ${MEDIFLOW_BILLING_RABBIT_RETRY_MAX_INTERVAL_MS:10000}
    outbox:
      enabled: ${MEDIFLOW_BILLING_OUTBOX_ENABLED:true}
      metrics-enabled: ${MEDIFLOW_BILLING_OUTBOX_METRICS_ENABLED:true}
      maintenance-enabled: ${MEDIFLOW_BILLING_OUTBOX_MAINTENANCE_ENABLED:true}
      batch-size: ${MEDIFLOW_BILLING_OUTBOX_BATCH_SIZE:100}
      dispatch-delay-ms: ${MEDIFLOW_BILLING_OUTBOX_DISPATCH_DELAY_MS:1000}
      dispatch-initial-delay-ms: ${MEDIFLOW_BILLING_OUTBOX_DISPATCH_INITIAL_DELAY_MS:1000}
      confirm-timeout-ms: ${MEDIFLOW_BILLING_OUTBOX_CONFIRM_TIMEOUT_MS:5000}
      lease-seconds: ${MEDIFLOW_BILLING_OUTBOX_LEASE_SECONDS:30}
      retention: ${MEDIFLOW_BILLING_OUTBOX_RETENTION:PT168H}
      retention-sweep-ms: ${MEDIFLOW_BILLING_OUTBOX_RETENTION_SWEEP_MS:3600000}
      metrics-refresh-ms: ${MEDIFLOW_BILLING_OUTBOX_METRICS_REFRESH_MS:30000}
      retry:
        initial-backoff-ms: ${MEDIFLOW_BILLING_OUTBOX_RETRY_INITIAL_BACKOFF_MS:1000}
        max-backoff-ms: ${MEDIFLOW_BILLING_OUTBOX_RETRY_MAX_BACKOFF_MS:60000}
        max-attempts: ${MEDIFLOW_BILLING_OUTBOX_RETRY_MAX_ATTEMPTS:5}

# Bảng giá phí sinh tự động từ event (PriceListPort). Mặc định đã có trong PriceListProperties;
# đặt exam-fee-by-department / lab-fee-by-type để override theo khoa / loại xét nghiệm.
billing:
  pricing:
    default-exam-fee: ${MEDIFLOW_BILLING_DEFAULT_EXAM_FEE:150000}
    default-lab-fee: ${MEDIFLOW_BILLING_DEFAULT_LAB_FEE:80000}
    exam-fee-by-department: {}
    lab-fee-by-type: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
