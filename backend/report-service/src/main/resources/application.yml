server:
  port: 8088

spring:
  application:
    name: report-service

  datasource:
    url: jdbc:postgresql://localhost:5432/mediflow_report
    username: ${MEDIFLOW_DB_USER:postgres}
    password: ${MEDIFLOW_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; never 'update' outside local dev
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${MEDIFLOW_RABBIT_HOST:localhost}
    port: 5672
    username: ${MEDIFLOW_RABBIT_USER:guest}
    password: ${MEDIFLOW_RABBIT_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${MEDIFLOW_REPORT_RABBIT_AUTO_STARTUP:true}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Shared HS256 secret — MUST match the gateway and be provided via environment.
mediflow:
  report:
    zone-id: ${MEDIFLOW_REPORT_ZONE_ID:Asia/Bangkok}
    rabbit:
      retry:
        max-attempts: ${MEDIFLOW_REPORT_RABBIT_RETRY_MAX_ATTEMPTS:3}
        initial-interval-ms: ${MEDIFLOW_REPORT_RABBIT_RETRY_INITIAL_INTERVAL_MS:1000}
        max-interval-ms: ${MEDIFLOW_REPORT_RABBIT_RETRY_MAX_INTERVAL_MS:10000}
  jwt:
    secret: ${MEDIFLOW_JWT_SECRET}
  security:
    # Swagger is an explicit local/development opt-in; production remains default-deny.
    swagger-permit: ${MEDIFLOW_REPORT_SWAGGER_PERMIT:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
