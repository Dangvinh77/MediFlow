server:
  port: 8090

spring:
  application:
    name: inpatient-service
  datasource:
    url: jdbc:postgresql://localhost:5432/mediflow_inpatient
    username: ${MEDIFLOW_DB_USER:postgres}
    password: ${MEDIFLOW_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${MEDIFLOW_RABBIT_HOST:localhost}
    port: 5672
    username: ${MEDIFLOW_RABBIT_USER:guest}
    password: ${MEDIFLOW_RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

mediflow:
  inpatient:
    persistence:
      enabled: true
    messaging:
      producer:
        enabled: false
      consumers:
        enabled: false
  jwt:
    secret: ${MEDIFLOW_JWT_SECRET}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: MediFlow Inpatient Service
    description: Inpatient admissions, beds and discharge workflow.
    version: v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
