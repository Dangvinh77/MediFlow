server:
  port: 8085

spring:
  application:
    name: pharmacy-service

  # Authentication is stateless JWT; do not create Spring Boot's default in-memory user/password.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/mediflow_pharmacy
    username: ${MEDIFLOW_DB_USER:postgres}
    password: ${MEDIFLOW_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; never 'update' outside local dev
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${MEDIFLOW_RABBIT_HOST:localhost}
    port: 5672
    username: ${MEDIFLOW_RABBIT_USER:guest}
    password: ${MEDIFLOW_RABBIT_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Shared HS256 secret — MUST match the gateway. Provide via env in real environments.
mediflow:
  jwt:
    secret: ${MEDIFLOW_JWT_SECRET:dev-only-change-me-please-32bytes-minimum-secret-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
