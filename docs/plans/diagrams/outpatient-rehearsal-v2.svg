<g class="message" data-from="N" data-to="C" data-label="Chọn session và tạo registration" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="90" x2="210" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Chọn session và tạo registration</text>
</g>
<g class="message" data-from="C" data-to="O" data-label="Kiểm nhân sự, khoa, phòng hiện hành" data-line-style="solid" data-arrow-head="filled" data-self="false">
