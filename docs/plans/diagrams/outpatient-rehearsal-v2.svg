</g>
<g class="message" data-from="B" data-to="B" data-label="Ghi tiền thực thu, allocation, clearance" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="490,568 520,568 520,588 490,588" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="528" y="578" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Ghi tiền thực thu, allocation, clearance</text>
</g>
