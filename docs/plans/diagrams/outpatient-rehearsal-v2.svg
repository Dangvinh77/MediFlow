</g>
<g class="message" data-from="C" data-to="B" data-label="Kiểm clearance và bắt đầu thực hiện" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="962" x2="490" y2="962" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="350" y="952" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Kiểm clearance và bắt đầu thực hiện</text>
</g>
<g class="message" data-from="C" data-to="D" data-label="Mở hồ sơ cùng lượt khám" data-line-style="dashed" data-arrow-head="filled" data-self="false">
