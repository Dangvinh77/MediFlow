  <polyline points="210,170 240,170 240,190 210,190" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="248" y="180" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Giữ suất 15 phút và ghi outbox</text>
</g>
<g class="message" data-from="C" data-to="B" data-label="outpatient.registration.changed" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="240" x2="490" y2="240" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="350" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">outpatient.registration.changed</text>
