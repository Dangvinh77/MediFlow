# ==========================================================================
# MediFlow — Docker Compose (DEV environment)
# ==========================================================================
# Chạy toàn bộ hệ thống chỉ với 1 lệnh:
#
#   docker compose up -d              # khởi động mọi thứ
#   docker compose logs -f backend    # xem log backend
#   docker compose down               # tắt hết
#
# Hệ thống gồm:
#   - PostgreSQL (DB) + RabbitMQ (message queue) — infrastructure
#   - Eureka Server (service discovery)
#   - Gateway (API gateway, JWT auth)
#   - 6 business deployments; legacy Support/deferred apps require explicit profiles
#   - Frontend (Next.js)
#
# Thứ tự khởi động: PostgreSQL → RabbitMQ → Eureka → Gateway → Business → Frontend
# ==========================================================================

services:

  # ======================================================================
  # INFRASTRUCTURE
  # ======================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mediflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - mediflow-pgdata:/var/lib/postgresql/data
      # Script tạo 10 databases khi chạy lần đầu
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mediflow-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mediflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"       # AMQP — services kết nối
      - "15672:15672"     # Web UI — http://localhost:15672 (guest/guest)
    volumes:
      - mediflow-rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mediflow-net

  # ======================================================================
  # SERVICE DISCOVERY
  # ======================================================================
  eureka-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: eureka-server
    container_name: mediflow-eureka
    ports:
      - "8761:8761"
    environment:
      # Eureka trong Docker cần hostname cố định
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      # Tắt chế độ tự bảo vệ (chỉ cho dev — nếu không Eureka từ chối xoá instance chết)
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: "false"
      # Đăng ký chính nó (standalone mode)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mediflow-net

  # ======================================================================
  # API GATEWAY
  # ======================================================================
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: mediflow-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
      MEDIFLOW_REPORT_DESTINATION: ${MEDIFLOW_REPORT_DESTINATION:-support-service}
      MEDIFLOW_NOTIFICATION_DESTINATION: ${MEDIFLOW_NOTIFICATION_DESTINATION:-support-service}
      SPRING_PROFILES_ACTIVE: outpatient-mvp
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mediflow-net

  # ======================================================================
  # BUSINESS SERVICES
  # ======================================================================
  # Mỗi service giống nhau về cấu trúc, chỉ khác:
  #   - SERVICE_NAME (thư mục Maven)
  #   - port
  #   - database name
  # ======================================================================

  core-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: core-service
    container_name: mediflow-core
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      MEDIFLOW_ORGANIZATION_DB_URL: jdbc:postgresql://postgres:5432/mediflow_organization
      MEDIFLOW_PATIENT_DB_URL: jdbc:postgresql://postgres:5432/mediflow_patient
      MEDIFLOW_DB_USER: postgres
      MEDIFLOW_DB_PASSWORD: postgres
      MEDIFLOW_RABBIT_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mediflow-net

  clinical-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: clinical-service
    container_name: mediflow-clinical
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediflow_clinical
      SPRING_RABBITMQ_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
      SPRING_PROFILES_ACTIVE: outpatient-mvp
      MEDIFLOW_CARE_FINANCE_V2_ENABLED: ${MEDIFLOW_CARE_FINANCE_V2_ENABLED:-false}
      MEDIFLOW_CLINICAL_PRESCRIPTION_CONTEXT_LOOKUP_ENABLED: ${MEDIFLOW_CLINICAL_PRESCRIPTION_CONTEXT_LOOKUP_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mediflow-net

  lab-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: lab-service
    container_name: mediflow-lab
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediflow_lab
      SPRING_RABBITMQ_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
      SPRING_PROFILES_ACTIVE: outpatient-mvp
      MEDIFLOW_CARE_FINANCE_V2: ${MEDIFLOW_CARE_FINANCE_V2:-false}
      MEDIFLOW_LAB_CLINICAL_CONTEXT_ENABLED: ${MEDIFLOW_LAB_CLINICAL_CONTEXT_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mediflow-net

  pharmacy-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: pharmacy-service
    container_name: mediflow-pharmacy
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediflow_pharmacy
      SPRING_RABBITMQ_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
      SPRING_PROFILES_ACTIVE: outpatient-mvp
      MEDIFLOW_CARE_FINANCE_V2: ${MEDIFLOW_CARE_FINANCE_V2:-false}
      MEDIFLOW_PHARMACY_IDENTITY_ENABLED: ${MEDIFLOW_PHARMACY_IDENTITY_ENABLED:-false}
      MEDIFLOW_PHARMACY_CLINICAL_CONTEXT_ENABLED: ${MEDIFLOW_PHARMACY_CLINICAL_CONTEXT_ENABLED:-false}
      MEDIFLOW_PHARMACY_CLEARANCE_CONSUMER_ENABLED: ${MEDIFLOW_PHARMACY_CLEARANCE_CONSUMER_ENABLED:-false}
      MEDIFLOW_PHARMACY_CLEARANCE_AUTHORITY_ENABLED: ${MEDIFLOW_PHARMACY_CLEARANCE_AUTHORITY_ENABLED:-false}
      MEDIFLOW_PHARMACY_OUTPATIENT_API_ENABLED: ${MEDIFLOW_PHARMACY_OUTPATIENT_API_ENABLED:-false}
      MEDIFLOW_PHARMACY_OUTPATIENT_EVENTS_ENABLED: ${MEDIFLOW_PHARMACY_OUTPATIENT_EVENTS_ENABLED:-false}
      MEDIFLOW_PHARMACY_OUTPATIENT_EVENTS_ACCEPTANCE_REFERENCE: ${MEDIFLOW_PHARMACY_OUTPATIENT_EVENTS_ACCEPTANCE_REFERENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mediflow-net

  billing-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: billing-service
    container_name: mediflow-billing
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediflow_billing
      SPRING_RABBITMQ_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
      SPRING_PROFILES_ACTIVE: outpatient-mvp
      MEDIFLOW_BILLING_PAYMENT_REQUEST_DISCOVERY_ENABLED: ${MEDIFLOW_BILLING_PAYMENT_REQUEST_DISCOVERY_ENABLED:-false}
      MEDIFLOW_BILLING_PRESCRIPTION_PRICE_CODES: ${MEDIFLOW_BILLING_PRESCRIPTION_PRICE_CODES:-RX-OUTPATIENT}
      MEDIFLOW_BILLING_OUTPATIENT_PUBLICATION_ENABLED: ${MEDIFLOW_BILLING_OUTPATIENT_PUBLICATION_ENABLED:-false}
      MEDIFLOW_BILLING_OUTPATIENT_PUBLICATION_PURPOSES: ${MEDIFLOW_BILLING_OUTPATIENT_PUBLICATION_PURPOSES:-}
      MEDIFLOW_BILLING_OUTPATIENT_PUBLICATION_ACCEPTANCE_REFERENCE: ${MEDIFLOW_BILLING_OUTPATIENT_PUBLICATION_ACCEPTANCE_REFERENCE:-}
      # MVP ngoại trú (docs/plans/05-implementation-plan.md M6-12): mở đúng các cờ Billing V1
      # cần cho EXAM/LAB_TEST/Rx — Admission/Surgery vẫn giữ false (deferred), không bật nhầm.
      MEDIFLOW_BILLING_CLEARANCE_LOOKUP_ENABLED: "true"
      MEDIFLOW_BILLING_LEDGER_ENABLED: "true"
      MEDIFLOW_BILLING_REFUNDS_ENABLED: "true"
      MEDIFLOW_BILLING_EXAM_CHARGE_CONSUMER_ENABLED: "true"
      MEDIFLOW_BILLING_LAB_TEST_CHARGE_CONSUMER_ENABLED: "true"
      MEDIFLOW_BILLING_PRESCRIPTION_CHARGE_CONSUMER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mediflow-net

  support-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: support-service
    container_name: mediflow-support
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      MEDIFLOW_REPORT_DB_URL: jdbc:postgresql://postgres:5432/mediflow_report
      MEDIFLOW_REPORT_DB_USER: ${MEDIFLOW_REPORT_DB_USER:-postgres}
      MEDIFLOW_REPORT_DB_PASSWORD: ${MEDIFLOW_REPORT_DB_PASSWORD:-postgres}
      MEDIFLOW_REPORT_DB_POOL_SIZE: ${MEDIFLOW_REPORT_DB_POOL_SIZE:-4}
      MEDIFLOW_NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/mediflow_notification
      MEDIFLOW_NOTIFICATION_DB_USER: ${MEDIFLOW_NOTIFICATION_DB_USER:-postgres}
      MEDIFLOW_NOTIFICATION_DB_PASSWORD: ${MEDIFLOW_NOTIFICATION_DB_PASSWORD:-postgres}
      MEDIFLOW_NOTIFICATION_DB_POOL_SIZE: ${MEDIFLOW_NOTIFICATION_DB_POOL_SIZE:-4}
      MEDIFLOW_RABBIT_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
      # New projection/producer gates remain OFF until original-byte acceptance.
      MEDIFLOW_CARE_FINANCE_V2: ${MEDIFLOW_CARE_FINANCE_V2:-false}
      MEDIFLOW_REPORT_OUTPATIENT_CONSUMER_ENABLED: ${MEDIFLOW_REPORT_OUTPATIENT_CONSUMER_ENABLED:-false}
      MEDIFLOW_REPORT_OUTPATIENT_READ_ENABLED: ${MEDIFLOW_REPORT_OUTPATIENT_READ_ENABLED:-false}
      MEDIFLOW_NOTIFICATION_CARE_V1_ENABLED: ${MEDIFLOW_NOTIFICATION_CARE_V1_ENABLED:-false}
      MEDIFLOW_NOTIFICATION_OUTPATIENT_PRESCRIPTION_CONSUMER_ENABLED: ${MEDIFLOW_NOTIFICATION_OUTPATIENT_PRESCRIPTION_CONSUMER_ENABLED:-false}
      MEDIFLOW_NOTIFICATION_REFUND_CONSUMER_ENABLED: ${MEDIFLOW_NOTIFICATION_REFUND_CONSUMER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mediflow-net

  # Rollback launchers only: stop Support before explicitly starting either legacy app.
  notification-service:
    profiles: [legacy-support]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: mediflow-notification
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediflow_notification
      SPRING_RABBITMQ_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
      # MVP ngoại trú (M6-07): mở in-app refund notice; Surgery notice/payment-request vẫn
      # giữ false (deferred), không bật nhầm qua global care-v1 flag.
      MEDIFLOW_NOTIFICATION_CARE_V1_ENABLED: "true"
      MEDIFLOW_NOTIFICATION_REFUND_CONSUMER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mediflow-net

  report-service:
    profiles: [legacy-support]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: report-service
    container_name: mediflow-report
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediflow_report
      SPRING_RABBITMQ_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mediflow-net

  # ======================================================================
  # PLANNED CARE CONTEXT — bootable foundation only, no business API yet
  # ======================================================================
  inpatient-service:
    profiles: [deferred]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: inpatient-service
    container_name: mediflow-inpatient
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediflow_inpatient
      SPRING_RABBITMQ_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mediflow-net

  surgery-service:
    profiles: [deferred]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: surgery-service
    container_name: mediflow-surgery
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: 8091
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediflow_surgery
      SPRING_RABBITMQ_HOST: rabbitmq
      MEDIFLOW_JWT_SECRET: dev-secret-key-change-in-production-32bytes-min!!
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mediflow-net

  # ======================================================================
  # FRONTEND — Next.js 16
  # ======================================================================
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        GATEWAY_URL: http://gateway:8080
    container_name: mediflow-frontend
    ports:
      - "3000:3000"
    environment:
      # Trong Docker, frontend gọi gateway qua tên container (không phải localhost)
      GATEWAY_URL: http://gateway:8080
      NODE_ENV: production
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - mediflow-net

# ======================================================================
# VOLUMES — dữ liệu database được lưu trên ổ cứng, không mất khi tắt
# ======================================================================
volumes:
  mediflow-pgdata:
  mediflow-rabbitdata:

# ======================================================================
# NETWORK — tất cả container chung 1 network, gọi nhau bằng tên service
# ======================================================================
networks:
  mediflow-net:
    name: mediflow-net
    driver: bridge
