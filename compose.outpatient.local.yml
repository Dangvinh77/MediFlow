# Opt-in rehearsal for OPD-SCHED-2026-10-26 revision 2.
# Use after docker-compose.yml and compose.demo.local.yml; see the 26/10 runbook.
services:
  gateway:
    environment:
      MEDIFLOW_GATEWAY_SCHEDULING_V2_ENABLED: "true"
  clinical-service:
    environment:
      MEDIFLOW_CLINICAL_SCHEDULING_ENABLED: "true"
      MEDIFLOW_V2_CLINIC_INTAKE: "true"
      # v2 waves 3-7 for the presentation: treatment courses, record amendments, Lab catalogue orders.
      MEDIFLOW_V2_TREATMENT_COURSE: "true"
      MEDIFLOW_V2_RECORD_AMENDMENT: "true"
      MEDIFLOW_V2_LABCATALOG: "true"
      MEDIFLOW_ADMISSION_REFERRAL_ENABLED: "false"
      # Same LAB_TEST codes as billing.care-finance.prices (below and Billing application.yml, lab V7 catalogue).
      MEDIFLOW_CLINICAL_LAB_PRICE_CODES: "LAB,LAB_CBC,LAB_GLUCOSE,LAB-CBC,LAB-GLU,LAB-HBSAG,LAB-UA,LAB-MICRO"
  lab-service:
    environment:
      # Lab v2 (waves 5-7); Organization must grant LAB_RESULT_RELEASE to two LAB_TECH (prepare_ui_demo does it).
      MEDIFLOW_V2_LABCATALOG: "true"
      MEDIFLOW_V2_LAB_REVIEW: "true"
      MEDIFLOW_V2_LAB_AMENDMENT: "true"
  billing-service:
    environment:
      MEDIFLOW_BILLING_SCHEDULED_PAYMENTS_ENABLED: "true"
      MEDIFLOW_BILLING_OUTPATIENT_QUOTES_ENABLED: "true"
      # The seeded Lab charge must outlive the gap between startup and the demo; default is PT72H.
      MEDIFLOW_BILLING_LAB_QUOTE_TTL: "P30D"
      MEDIFLOW_BILLING_ZERO_PAYABLE_ELIGIBILITY_ENABLED: "true"
      MEDIFLOW_BILLING_SCHEDULED_ELIGIBILITY_PUBLICATION_ENABLED: "true"
      MEDIFLOW_BILLING_SCHEDULED_ELIGIBILITY_PUBLICATION_ACCEPTANCE_REFERENCE: "LOCAL-OUTPATIENT-REHEARSAL-2026-10-26"
      SPRING_APPLICATION_JSON: >-
        {
          "billing": {
            "care-finance": {
              "prices": {
                "OUTPATIENT_EXAM": {"description": "Kham moi ngoai tru demo", "unitAmount": 100000.00},
                "OUTPATIENT_FOLLOW_UP": {"description": "Tai kham ngoai tru demo", "unitAmount": 80000.00},
                "LAB": {"description": "Xet nghiem khac demo", "unitAmount": 80000.00},
                "LAB_CBC": {"description": "Cong thuc mau demo", "unitAmount": 120000.00},
                "LAB-CBC": {"description": "Cong thuc mau demo (danh muc)", "unitAmount": 120000.00},
                "LAB_GLUCOSE": {"description": "Duong huyet demo", "unitAmount": 40000.00}
              }
            },
            "outpatient-quotes": {
              "catalogue-version": "DEMO-CATALOGUE-2026-10-26",
              "policy-version": "DEMO-BHYT-2026-10-25",
              "items": [
                {"source-type": "EXAM", "price-code": "OUTPATIENT_EXAM", "support-rate": 0.50},
                {"source-type": "EXAM", "price-code": "OUTPATIENT_FOLLOW_UP", "support-rate": 0.50},
                {"source-type": "LAB_TEST", "price-code": "LAB_CBC", "support-rate": 0.70},
                {"source-type": "LAB_TEST", "price-code": "LAB_GLUCOSE", "support-rate": 0.50},
                {"source-type": "LAB_TEST", "price-code": "LAB-CBC", "support-rate": 0.70},
                {"source-type": "LAB_TEST", "price-code": "LAB-GLU", "support-rate": 0.50},
                {"source-type": "LAB_TEST", "price-code": "LAB-HBSAG", "support-rate": 0.50},
                {"source-type": "LAB_TEST", "price-code": "LAB-UA", "support-rate": 0.50},
                {"source-type": "LAB_TEST", "price-code": "LAB-MICRO", "support-rate": 0.50}
              ]
            }
          },
          "mediflow": {
            "billing": {
              "outpatient-refund-publication": {
                "enabled": true,
                "acceptance-reference": "LOCAL-OUTPATIENT-REHEARSAL-2026-10-26"
              }
            }
          }
        }
  support-service:
    environment:
      MEDIFLOW_NOTIFICATION_OUTPATIENT_REGISTRATION_CONSUMER_ENABLED: "true"
      MEDIFLOW_NOTIFICATION_LAB_CRITICAL_ENABLED: "true"
  frontend:
    environment:
      MEDIFLOW_SCHEDULING_UI_ENABLED: "true"
      MEDIFLOW_CLINIC_INTAKE_UI_ENABLED: "true"
      MEDIFLOW_OUTPATIENT_QUOTES_UI_ENABLED: "true"
      MEDIFLOW_ZERO_PAYABLE_UI_ENABLED: "true"
